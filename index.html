<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#77749b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>LISEC - Compte rendu d'intervention</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #f7f7fb;
      --panel: #ffffff;
      --ink: #262638;
      --muted: #68677a;
      --line: #dcdae8;
      --brand: #77749b;
      --brand-strong: #55527c;
      --green: #9bd542;
      --yellow: #f3df39;
      --pink: #ff5c9e;
      --danger: #b42318;
      --shadow: 0 12px 32px rgba(39, 37, 63, 0.12);
      --radius: 8px;
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-size: 18px;
      line-height: 1.45;
      -webkit-text-size-adjust: 100%;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    input,
    select,
    textarea,
    label {
      touch-action: manipulation;
    }

    .app {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    header {
      display: flex;
      gap: 18px;
      align-items: flex-start;
      flex-direction: column;
      padding: 18px 0 12px;
    }

    .logo {
      width: min(260px, 46vw);
      height: auto;
      display: block;
    }

    .header-text {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 3vw, 2rem);
      line-height: 1.1;
      color: var(--brand-strong);
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    form {
      display: grid;
      gap: 18px;
    }

    section,
    .review-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    section h2,
    .review-panel h2 {
      margin: 0 0 14px;
      font-size: 1.25rem;
      color: var(--brand-strong);
    }

    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: 1fr;
    }

    .visit-row {
      display: grid;
      gap: 8px;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
    }

    .visit-row .field {
      min-width: 0;
    }

    .visit-row input {
      min-width: 0;
      padding-left: 9px;
      padding-right: 9px;
    }

    .postal-row,
    .people-grid,
    .construction-list {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .diffusion-grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 700;
      color: var(--ink);
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 54px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      padding: 13px 14px;
      outline: none;
    }

    textarea {
      min-height: 128px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(119, 116, 155, 0.16);
    }

    .hint {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .actions,
    .inline-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      min-height: 54px;
      border: 0;
      border-radius: var(--radius);
      padding: 13px 18px;
      background: var(--brand);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .top-actions button {
      flex: 1 1 240px;
    }

    .form-actions {
      display: grid;
      gap: 10px;
      padding-bottom: env(safe-area-inset-bottom);
    }

    button.secondary {
      background: #eeedf6;
      color: var(--brand-strong);
    }

    button.level-add {
      background: var(--brand-strong);
      color: #fff;
      border: 1px solid var(--brand-strong);
    }

    button.danger {
      background: #fff0ef;
      color: var(--danger);
      border: 1px solid #ffd1cc;
    }

    button:disabled {
      opacity: 0.55;
      cursor: progress;
    }

    .level {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      background: #fbfbfe;
      display: grid;
      gap: 12px;
    }

    .disorders {
      background: #e2e5f3;
      border-color: #c7cce3;
    }

    .levels {
      display: grid;
      gap: 18px;
    }

    .level-head,
    .entry-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .level-title {
      margin: 0;
      font-size: 1.1rem;
      color: var(--brand-strong);
    }

    .entry {
      border-left: 5px solid var(--brand);
      background: #fff;
      border-radius: var(--radius);
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .entry + .entry {
      margin-top: 8px;
      padding-top: 22px;
      border-top: 2px solid #d8dcee;
    }

    .entry:nth-child(3n + 1) {
      border-left-color: var(--green);
    }

    .entry:nth-child(3n + 2) {
      border-left-color: var(--yellow);
    }

    .entry:nth-child(3n + 3) {
      border-left-color: var(--pink);
    }

    .entry-title {
      font-weight: 700;
      color: var(--brand-strong);
    }

    .entry-actions {
      display: grid;
      gap: 10px;
    }

    .photos {
      display: grid;
      gap: 10px;
    }

    .photo-buttons {
      display: grid;
      gap: 10px;
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
      border: 0;
      padding: 0;
    }

    .file-button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      border-radius: var(--radius);
      background: var(--brand);
      color: #fff;
      font-weight: 700;
      padding: 13px 18px;
    }

    .file-button.secondary {
      background: #eeedf6;
      color: var(--brand-strong);
    }

    .photo-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
      gap: 10px;
    }

    .photo-chip {
      min-height: 112px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: #f4f3fa;
      display: grid;
      grid-template-rows: 1fr auto;
    }

    .photo-chip img {
      width: 100%;
      height: 92px;
      object-fit: cover;
      display: block;
    }

    .photo-chip span {
      padding: 6px;
      font-size: 0.78rem;
      color: var(--muted);
      word-break: break-word;
    }

    .site-photo-preview {
      display: none;
      width: min(360px, 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: #f4f3fa;
    }

    .site-photo-preview.has-photo {
      display: grid;
      gap: 0;
    }

    .site-photo-preview img {
      display: block;
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      background: #fff;
    }

    .site-photo-preview button {
      border-radius: 0;
    }

    .status {
      min-height: 28px;
      color: var(--muted);
      font-weight: 700;
    }

    .status.error {
      color: var(--danger);
    }

    .status.ok {
      color: #26734d;
    }

    .review {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 19, 34, 0.46);
      z-index: 10;
      padding: 18px;
      overflow: auto;
    }

    .review.open {
      display: block;
    }

    .review-panel {
      max-width: 920px;
      margin: 0 auto;
    }

    .review-content {
      display: grid;
      gap: 14px;
      max-height: 62vh;
      overflow: auto;
      padding-right: 4px;
    }

    .review-block {
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
    }

    .review-block:last-child {
      border-bottom: 0;
    }

    .review-block h3 {
      margin: 0 0 8px;
      font-size: 1.05rem;
      color: var(--brand-strong);
    }

    .review-block p {
      margin: 5px 0;
      white-space: pre-wrap;
    }

    .review-notice {
      margin: 0 0 14px;
      padding: 12px 14px;
      border-left: 5px solid var(--brand);
      background: #eeedf6;
      color: var(--brand-strong);
      font-weight: 700;
    }

    .review-notice.warning {
      border-left-color: #d89a00;
      background: #fff7dc;
      color: #654900;
    }

    @media (max-width: 720px) {
      .app {
        padding: 12px;
      }

      section,
      .review-panel {
        padding: 14px;
      }

      button {
        width: 100%;
      }

      .file-button {
        width: 100%;
      }

      .visit-row {
        gap: 8px;
        grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
      }

      .level-head {
        align-items: stretch;
        flex-direction: column;
      }

      .inline-actions button {
        width: 100%;
      }
    }

    @media (max-width: 520px) {
      .visit-row,
      .postal-row,
      .people-grid,
      .construction-list,
      .diffusion-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <img class="logo" src="assets/logo-lisec.png" alt="LISEC">
      <div class="header-text">
        <h1>Compte rendu d'intervention</h1>
        <p class="subtitle">Saisie mobile, photos, rapport Word et envoi au secrétariat.</p>
      </div>
    </header>

    <form id="reportForm">
      <section>
        <h2>Intervention</h2>
        <div class="grid">
          <div class="visit-row">
            <div class="field">
              <label for="visitDate">Date de visite</label>
              <input id="visitDate" name="visitDate" type="date">
            </div>
            <div class="field">
              <label for="visitTime">Heure</label>
              <input id="visitTime" name="visitTime" type="time">
            </div>
          </div>
          <div class="field">
            <label for="engineer">Nom de l'ingénieur</label>
            <input id="engineer" name="engineer" type="text" autocomplete="name">
          </div>
        </div>
      </section>

      <section>
        <h2>Lieu de la visite</h2>
        <div class="grid">
          <div class="field full">
            <label for="siteAddress">Adresse</label>
            <input id="siteAddress" name="siteAddress" type="text" autocomplete="street-address">
          </div>
          <div class="postal-row full">
            <div class="field">
              <label for="postalCode">Code postal</label>
              <input id="postalCode" name="postalCode" type="text" inputmode="numeric" autocomplete="postal-code">
            </div>
            <div class="field">
              <label for="city">Ville</label>
              <input id="city" name="city" type="text" autocomplete="address-level2">
            </div>
          </div>
        </div>
      </section>

      <section>
        <h2>Photo du lieu</h2>
        <div class="field photos">
          <div class="photo-buttons">
            <label class="file-button" for="siteCameraPhoto">Prendre une photo</label>
            <input class="file-input" id="siteCameraPhoto" type="file" accept="image/*" capture="environment">
            <label class="file-button secondary" for="siteGalleryPhoto">Ajouter depuis la galerie</label>
            <input class="file-input" id="siteGalleryPhoto" type="file" accept="image/*">
          </div>
          <div class="site-photo-preview" id="sitePhotoPreview"></div>
        </div>
      </section>

      <section>
        <h2>Client</h2>
        <div class="field">
          <label for="clientBlock">Nom et adresse complète du client</label>
          <textarea id="clientBlock" name="clientBlock"></textarea>
        </div>
      </section>

      <section>
        <h2>Mission</h2>
        <div class="field">
          <label for="mission">Texte de la mission</label>
          <textarea id="mission" name="mission"></textarea>
        </div>
      </section>

      <section>
        <h2>Personnes présentes</h2>
        <div class="people-grid">
          <div class="field">
            <label for="presentPerson1">Personne 1</label>
            <input id="presentPerson1" name="presentPerson1" type="text">
          </div>
          <div class="field">
            <label for="presentPerson2">Personne 2</label>
            <input id="presentPerson2" name="presentPerson2" type="text">
          </div>
          <div class="field">
            <label for="presentPerson3">Personne 3</label>
            <input id="presentPerson3" name="presentPerson3" type="text">
          </div>
          <div class="field">
            <label for="presentPerson4">Personne 4</label>
            <input id="presentPerson4" name="presentPerson4" type="text">
          </div>
        </div>
      </section>

      <section>
        <h2>Description générale</h2>
        <div class="grid">
          <div class="field full">
            <label for="workDescription">Description de l'ouvrage</label>
            <textarea id="workDescription" name="workDescription"></textarea>
          </div>
          <div class="field full">
            <label for="visitNote">Note particulière sur la visite</label>
            <textarea id="visitNote" name="visitNote"></textarea>
          </div>
        </div>
      </section>

      <section>
        <h2>Construction</h2>
        <div class="construction-list">
          <div class="field"><label for="construction1">Élément 1</label><input id="construction1" type="text"></div>
          <div class="field"><label for="construction2">Élément 2</label><input id="construction2" type="text"></div>
          <div class="field"><label for="construction3">Élément 3</label><input id="construction3" type="text"></div>
          <div class="field"><label for="construction4">Élément 4</label><input id="construction4" type="text"></div>
          <div class="field"><label for="construction5">Élément 5</label><input id="construction5" type="text"></div>
          <div class="field"><label for="construction6">Élément 6</label><input id="construction6" type="text"></div>
        </div>
      </section>

      <section class="disorders">
        <h2>Désordres constatés</h2>
        <div id="levels" class="levels"></div>
        <div class="field" style="margin-top: 18px;">
          <label for="newLevelName">Ajouter un niveau complémentaire</label>
          <input id="newLevelName" type="text" placeholder="Ex : R+4, Sous-sol, Combles" aria-label="Nom du niveau à ajouter">
          <button class="level-add" type="button" id="addLevelBtn">Ajouter ce niveau</button>
        </div>
      </section>

      <section>
        <h2>Synthèse</h2>
        <div class="grid">
          <div class="field full">
            <label for="conclusion">Conclusion</label>
            <textarea id="conclusion" name="conclusion"></textarea>
          </div>
          <div class="field full">
            <label for="recommendation">Préconisation</label>
            <textarea id="recommendation" name="recommendation"></textarea>
          </div>
        </div>
      </section>

      <section>
        <h2>Diffusion</h2>
        <div class="diffusion-grid">
          <div class="field">
            <label for="diffusion1">Nom 1</label>
            <input id="diffusion1" name="diffusion1" type="text">
          </div>
          <div class="field">
            <label for="diffusion2">Nom 2</label>
            <input id="diffusion2" name="diffusion2" type="text">
          </div>
          <div class="field">
            <label for="diffusion3">Nom 3</label>
            <input id="diffusion3" name="diffusion3" type="text">
          </div>
        </div>
      </section>

      <div class="status" id="status"></div>

      <div class="form-actions">
        <button type="button" id="completionBtn">Envoyer pour complément</button>
        <button class="secondary" type="button" id="generateReportBtn">Générer le rapport</button>
      </div>
    </form>
  </main>

  <div class="review" id="review">
    <div class="review-panel">
      <h2 id="reviewTitle">Récapitulatif</h2>
      <div class="review-notice" id="reviewNotice"></div>
      <div class="review-content" id="reviewContent"></div>
      <div class="actions" style="margin-top: 16px;">
        <button type="button" id="confirmActionBtn">Confirmer</button>
        <button class="secondary" type="button" id="closeReviewBtn">Modifier</button>
      </div>
    </div>
  </div>

  <script src="data.js?v=2026-07-29-7"></script>
  <script>
    const APP_VERSION = "2026-07-29-7";
    const MAX_PHOTO_WIDTH = 1600;
    const JPEG_QUALITY = 0.72;
    const STORAGE_KEY = "lisec_intervention_draft_v2";
    const LEGACY_STORAGE_KEY = "lisec_intervention_draft_v1";
    const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyKTUQ-SGyClnkjDfo2AuYZqTmpic8qjfiNn3aSdYUBbRPJLnj6mH3h-SjLKIvwjlki/exec";

    const state = {
      levels: [],
      photoId: 1,
      sitePhoto: null,
      pendingAction: null
    };

    let autoSaveTimer = null;

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));

    function init() {
      ensureFreshVersion();
      window.LISEC_DATA.niveaux.forEach((name) => addLevel(name, false, true));
      $("#visitDate").valueAsDate = new Date();
      $("#visitTime").value = currentTimeValue();

      restoreDraft();
      bindEvents();
      registerServiceWorker();
    }

    function bindEvents() {
      $("#addLevelBtn").addEventListener("click", () => {
        const input = $("#newLevelName");
        const name = input.value.trim();
        if (!name) {
          setStatus("Indique le nom du niveau a ajouter, par exemple R+4.", true);
          input.focus();
          return;
        }
        addLevel(name, true, false);
        input.value = "";
          setStatus(`Niveau ${name} ajouté.`, false, true);
      });

      $("#completionBtn").addEventListener("click", () => openReview("completion"));
      $("#generateReportBtn").addEventListener("click", () => openReview("report"));
      $("#closeReviewBtn").addEventListener("click", () => $("#review").classList.remove("open"));
      $("#confirmActionBtn").addEventListener("click", submitWorkflow);
      $("#siteCameraPhoto").addEventListener("change", handleSitePhotoSelection);
      $("#siteGalleryPhoto").addEventListener("change", handleSitePhotoSelection);
      $("#reportForm").addEventListener("input", scheduleAutoSave);
      $("#reportForm").addEventListener("change", scheduleAutoSave);
      window.addEventListener("beforeunload", () => saveDraft(false));
    }

    function addLevel(name, withFirstEntry = false, isDefault = false) {
      const level = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        name,
        isDefault,
        entries: []
      };
      state.levels.push(level);
      renderLevels();
      if (withFirstEntry) addEntry(level.id);
      scheduleAutoSave();
    }

    function addEntry(levelId) {
      const level = state.levels.find((item) => item.id === levelId);
      if (!level) return;
      level.entries.push({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        localisation: "",
        comment: "",
        gravity: "",
        photos: []
      });
      renderLevels();
      scheduleAutoSave();
    }

    function removeEntry(levelId, entryId) {
      const level = state.levels.find((item) => item.id === levelId);
      if (!level) return;
      level.entries = level.entries.filter((entry) => entry.id !== entryId);
      renderLevels();
      scheduleAutoSave();
    }

    function removeLevel(levelId) {
      state.levels = state.levels.filter((level) => level.id !== levelId);
      renderLevels();
      scheduleAutoSave();
    }

    function renderLevels() {
      const levelsRoot = $("#levels");
      levelsRoot.innerHTML = "";

      state.levels.forEach((level) => {
        const levelEl = document.createElement("div");
        levelEl.className = "level";
        levelEl.dataset.levelId = level.id;
        levelEl.innerHTML = `
          <div class="level-head">
            <h3 class="level-title">Désordres sur ${escapeHtml(level.name)}</h3>
          </div>
          <div class="entries"></div>
          <div class="entry-actions">
            <button class="secondary" type="button" data-action="add-entry">Ajouter une localisation</button>
            ${level.isDefault ? "" : '<button class="danger" type="button" data-action="remove-level">Supprimer ce niveau</button>'}
          </div>
        `;

        const entriesRoot = $(".entries", levelEl);
        level.entries.forEach((entry, index) => entriesRoot.appendChild(renderEntry(level.id, entry, index)));
        levelsRoot.appendChild(levelEl);

        $('[data-action="add-entry"]', levelEl).addEventListener("click", () => addEntry(level.id));
        const removeLevelButton = $('[data-action="remove-level"]', levelEl);
        if (removeLevelButton) removeLevelButton.addEventListener("click", () => removeLevel(level.id));
      });
    }

    function renderEntry(levelId, entry, index) {
      const entryEl = document.createElement("div");
      entryEl.className = "entry";
      entryEl.dataset.entryId = entry.id;
      entryEl.innerHTML = `
        <div class="grid">
          <div class="field full">
            <label>Localisation ${index + 1}</label>
            <input type="text" data-field="localisation" value="${escapeHtml(entry.localisation)}" placeholder="Ex : façade avant, angle gauche, cage d'escalier">
          </div>
          <div class="field full">
            <label>Commentaire</label>
            <textarea data-field="comment">${escapeHtml(entry.comment)}</textarea>
          </div>
          <div class="field">
            <label>Gravité</label>
            <select data-field="gravity">${window.LISEC_DATA.gravites.map((value) => `<option value="${escapeHtml(value)}" ${entry.gravity === value ? "selected" : ""}>${escapeHtml(value)}</option>`).join("")}</select>
          </div>
          <div class="field photos">
            <label>Photos</label>
            <div class="photo-buttons">
              <label class="file-button" data-action="camera-label">Prendre une photo</label>
              <input class="file-input" type="file" accept="image/*" capture="environment" data-field="cameraPhotos">
              <label class="file-button secondary" data-action="gallery-label">Ajouter depuis la galerie</label>
              <input class="file-input" type="file" accept="image/*" multiple data-field="galleryPhotos">
            </div>
            <div class="hint">Pour plusieurs photos à la suite, reprendre une photo autant de fois que nécessaire, ou sélectionner plusieurs images depuis la galerie.</div>
          </div>
        </div>
        <div class="photo-list"></div>
        <div class="entry-actions">
          <button class="secondary" type="button" data-action="add-entry-after">Ajouter une localisation</button>
          <button class="danger" type="button" data-action="remove-entry">Supprimer cette localisation</button>
        </div>
      `;

      $('[data-action="remove-entry"]', entryEl).addEventListener("click", () => removeEntry(levelId, entry.id));
      $('[data-action="add-entry-after"]', entryEl).addEventListener("click", () => addEntry(levelId));
      $('[data-action="camera-label"]', entryEl).addEventListener("click", () => $('[data-field="cameraPhotos"]', entryEl).click());
      $('[data-action="gallery-label"]', entryEl).addEventListener("click", () => $('[data-field="galleryPhotos"]', entryEl).click());
      $('[data-field="localisation"]', entryEl).addEventListener("input", (event) => entry.localisation = event.target.value);
      $('[data-field="comment"]', entryEl).addEventListener("input", (event) => entry.comment = event.target.value);
      $('[data-field="gravity"]', entryEl).addEventListener("change", (event) => entry.gravity = event.target.value);
      $('[data-field="cameraPhotos"]', entryEl).addEventListener("change", (event) => {
        addPhotos(entry, event.target.files);
        event.target.value = "";
      });
      $('[data-field="galleryPhotos"]', entryEl).addEventListener("change", (event) => {
        addPhotos(entry, event.target.files);
        event.target.value = "";
      });

      renderPhotoList(entry, $(".photo-list", entryEl));
      return entryEl;
    }

    async function addPhotos(entry, files) {
        setStatus("Préparation des photos...");
      for (const file of Array.from(files || [])) {
        try {
          const compressed = await compressImage(file);
          entry.photos.push({
            id: state.photoId++,
            name: file.name || `photo-${state.photoId}.jpg`,
            type: "image/jpeg",
            size: compressed.size,
            dataUrl: compressed.dataUrl
          });
        } catch (error) {
          setStatus(`Photo ignorée : ${file.name}`, true);
        }
      }
      renderLevels();
      setStatus("Photos ajoutées.", false, true);
      scheduleAutoSave();
    }

    async function handleSitePhotoSelection(event) {
      const file = Array.from(event.target.files || [])[0];
      event.target.value = "";
      if (!file) return;
      setStatus("Préparation de la photo du lieu...");
      try {
        const compressed = await compressImage(file);
        state.sitePhoto = {
          id: state.photoId++,
          name: file.name || "photo-du-lieu.jpg",
          type: "image/jpeg",
          size: compressed.size,
          dataUrl: compressed.dataUrl
        };
        renderSitePhoto();
        setStatus("Photo du lieu ajoutée.", false, true);
        scheduleAutoSave();
      } catch (error) {
        setStatus(`Photo ignorée : ${file.name}`, true);
      }
    }

    function renderSitePhoto() {
      const preview = $("#sitePhotoPreview");
      preview.innerHTML = "";
      preview.classList.toggle("has-photo", Boolean(state.sitePhoto));
      if (!state.sitePhoto) return;

      const image = document.createElement("img");
      image.src = state.sitePhoto.dataUrl;
      image.alt = "Photo du lieu";
      const removeButton = document.createElement("button");
      removeButton.type = "button";
      removeButton.className = "danger";
      removeButton.textContent = "Supprimer la photo";
      removeButton.addEventListener("click", () => {
        state.sitePhoto = null;
        renderSitePhoto();
        scheduleAutoSave();
      });
      preview.append(image, removeButton);
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const scale = Math.min(1, MAX_PHOTO_WIDTH / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL("image/jpeg", JPEG_QUALITY);
            resolve({ dataUrl, size: Math.round((dataUrl.length * 3) / 4) });
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function renderPhotoList(entry, root) {
      root.innerHTML = "";
      entry.photos.forEach((photo) => {
        const chip = document.createElement("div");
        chip.className = "photo-chip";
        chip.innerHTML = `<img src="${photo.dataUrl}" alt=""><span>${escapeHtml(photo.name)}</span>`;
        chip.addEventListener("click", () => {
          entry.photos = entry.photos.filter((item) => item.id !== photo.id);
          renderLevels();
        });
        root.appendChild(chip);
      });
    }

    function collectPayload(workflowAction = "") {
      const presentPeopleEntries = [1, 2, 3, 4]
        .map((index) => $(`#presentPerson${index}`).value.trim());
      const constructionItems = [1, 2, 3, 4, 5, 6]
        .map((index) => $(`#construction${index}`).value.trim());
      const diffusionEntries = [1, 2, 3]
        .map((index) => $(`#diffusion${index}`).value.trim());
      const payload = {
        submittedAt: new Date().toISOString(),
        workflowAction,
        company: "LISEC",
        visitDate: $("#visitDate").value,
        visitTime: $("#visitTime").value,
        engineer: $("#engineer").value.trim(),
        siteAddress: $("#siteAddress").value.trim(),
        postalCode: $("#postalCode").value.trim(),
        city: $("#city").value.trim(),
        sitePhoto: state.sitePhoto,
        clientBlock: $("#clientBlock").value.trim(),
        mission: $("#mission").value.trim(),
        presentPeopleEntries,
        presentPeople: presentPeopleEntries.filter(Boolean).join("\n"),
        workDescription: $("#workDescription").value.trim(),
        constructionItems,
        construction: constructionItems.filter(Boolean).join("\n"),
        visitNote: $("#visitNote").value.trim(),
        conclusion: $("#conclusion").value.trim(),
        recommendation: $("#recommendation").value.trim(),
        diffusionEntries,
        diffusion: diffusionEntries.filter(Boolean).join("\n"),
        levels: state.levels.map((level) => ({
          id: level.id,
          name: level.name,
          entries: level.entries.map((entry) => ({
            id: entry.id,
            localisation: entry.localisation,
            comment: entry.comment,
            gravity: entry.gravity,
            photos: entry.photos
          }))
        }))
      };
      return payload;
    }

    function openReview(action) {
      state.pendingAction = action;
      const payload = collectPayload(action);
      const photoCount = payload.levels.reduce((total, level) => total + level.entries.reduce((sum, entry) => sum + entry.photos.length, 0), 0);
      const filledEntries = payload.levels.reduce((total, level) => total + level.entries.length, 0);
      const missingFields = getMissingReportFields(payload);
      const isCompletion = action === "completion";

      $("#reviewTitle").textContent = isCompletion
        ? "Récapitulatif avant envoi pour complément"
        : "Récapitulatif avant génération";
      $("#reviewNotice").textContent = isCompletion
        ? "Le secrétariat recevra ce dossier pour le compléter avant la génération du rapport."
        : missingFields.length
          ? `${missingFields.length} rubrique(s) sont encore vides. Le rapport peut tout de même être généré.`
          : "Le dossier contient toutes les rubriques principales et peut être généré.";
      $("#reviewNotice").classList.toggle("warning", !isCompletion && missingFields.length > 0);
      $("#confirmActionBtn").textContent = isCompletion
        ? "Envoyer pour complément"
        : missingFields.length
          ? "Générer malgré les champs vides"
          : "Générer le rapport";

      $("#reviewContent").innerHTML = `
        <div class="review-block">
          <h3>Intervention</h3>
          <p><strong>Date et heure :</strong> ${escapeHtml([payload.visitDate, payload.visitTime].filter(Boolean).join(" "))}</p>
          <p><strong>Ingénieur :</strong> ${escapeHtml(payload.engineer)}</p>
        </div>
        <div class="review-block">
          <h3>Lieu de la visite</h3>
          <p>${escapeHtml(payload.siteAddress || "Non renseigné")}</p>
          <p>${escapeHtml([payload.postalCode, payload.city].filter(Boolean).join(" ") || "Code postal et ville non renseignés")}</p>
          <p><strong>Photo du lieu :</strong> ${payload.sitePhoto ? "1 photo" : "Non renseignée"}</p>
        </div>
        <div class="review-block">
          <h3>Client</h3>
          <p>${escapeHtml(payload.clientBlock || "Non renseigné")}</p>
        </div>
        <div class="review-block">
          <h3>Mission</h3>
          <p>${escapeHtml(payload.mission || "Non renseignée")}</p>
        </div>
        <div class="review-block">
          <h3>Personnes présentes</h3>
          <p>${escapeHtml(payload.presentPeople || "Non renseigné")}</p>
        </div>
        <div class="review-block">
          <h3>Description</h3>
          <p>${escapeHtml(payload.workDescription || "Non renseigné")}</p>
        </div>
        <div class="review-block">
          <h3>Construction</h3>
          <p>${escapeHtml(payload.constructionItems.filter(Boolean).map((item) => `- ${item}`).join("\n") || "Non renseignée")}</p>
        </div>
        <div class="review-block">
          <h3>Note particulière</h3>
          <p>${escapeHtml(payload.visitNote || "Non renseigné")}</p>
        </div>
        <div class="review-block">
          <h3>Désordres</h3>
          <p>${filledEntries} localisation(s), ${photoCount} photo(s).</p>
          ${payload.levels.map(renderLevelReview).join("")}
        </div>
        <div class="review-block">
          <h3>Conclusion</h3>
          <p>${escapeHtml(payload.conclusion || "Non renseigné")}</p>
        </div>
        <div class="review-block">
          <h3>Préconisation</h3>
          <p>${escapeHtml(payload.recommendation || "Non renseigné")}</p>
        </div>
        <div class="review-block">
          <h3>Diffusion</h3>
          <p>${escapeHtml(payload.diffusion || "Non renseignée")}</p>
        </div>
      `;
      $("#review").classList.add("open");
    }

    function getMissingReportFields(payload) {
      const checks = [
        ["Ingénieur", payload.engineer],
        ["Adresse", payload.siteAddress],
        ["Code postal", payload.postalCode],
        ["Ville", payload.city],
        ["Photo du lieu", payload.sitePhoto],
        ["Client", payload.clientBlock],
        ["Mission", payload.mission],
        ["Personnes présentes", payload.presentPeople],
        ["Description", payload.workDescription],
        ["Construction", payload.constructionItems.some(Boolean)],
        ["Conclusion", payload.conclusion],
        ["Préconisation", payload.recommendation],
        ["Diffusion", payload.diffusion]
      ];
      return checks.filter(([, value]) => !value).map(([label]) => label);
    }

    function renderLevelReview(level) {
      if (!level.entries.length) return `<p><strong>${escapeHtml(level.name)} :</strong> aucune localisation.</p>`;
      return `
        <p><strong>${escapeHtml(level.name)}</strong></p>
        ${level.entries.map((entry, index) => `
          <p>
            ${index + 1}. ${escapeHtml(entry.localisation || "Localisation non renseignee")}
            - ${escapeHtml(entry.gravity || "Gravite non renseignee")}
            - ${entry.photos.length} photo(s)<br>
            ${escapeHtml(entry.comment || "")}
          </p>
        `).join("")}
      `;
    }

    async function submitWorkflow() {
      const action = state.pendingAction || "completion";
      const scriptUrl = GOOGLE_APPS_SCRIPT_URL.trim();
      if (!scriptUrl) {
        setStatus("Application pas encore connectée à Google. Il faut ajouter l'adresse Apps Script dans le code avant le vrai envoi.", true);
        return;
      }

      const payload = collectPayload(action);
      $("#confirmActionBtn").disabled = true;
      setStatus(action === "completion" ? "Envoi au secrétariat en cours..." : "Génération du rapport en cours...");

      try {
        const response = await fetch(scriptUrl, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        if (response.type !== "opaque") {
          const result = await response.json();
          if (!result.ok) throw new Error(result.error || "Erreur inconnue");
        }

        const successMessage = action === "completion"
          ? "Dossier transmis au secrétariat. Un nouveau compte rendu peut être saisi."
          : "Rapport transmis pour génération et envoi. Un nouveau compte rendu peut être saisi.";
        $("#review").classList.remove("open");
        resetFormAfterSubmission();
        setStatus(successMessage, false, true);
      } catch (error) {
        setStatus(`Envoi impossible : ${error.message}`, true);
      } finally {
        $("#confirmActionBtn").disabled = false;
      }
    }

    function resetFormAfterSubmission() {
      clearTimeout(autoSaveTimer);
      $("#reportForm").reset();
      state.levels = [];
      state.sitePhoto = null;
      state.pendingAction = null;
      state.photoId = 1;
      window.LISEC_DATA.niveaux.forEach((name) => addLevel(name, false, true));
      clearTimeout(autoSaveTimer);
      renderSitePhoto();
      $("#visitDate").valueAsDate = new Date();
      $("#visitTime").value = currentTimeValue();
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(LEGACY_STORAGE_KEY);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function scheduleAutoSave() {
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(() => saveDraft(false), 500);
    }

    function saveDraft(showConfirmation = false) {
      try {
        const draft = collectPayload();
        draft.sitePhoto = null;
        draft.levels.forEach((level) => level.entries.forEach((entry) => entry.photos = []));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(draft));
        if (showConfirmation) {
          setStatus("Textes sauvegardés sur cet appareil. Les photos restent disponibles tant que cette page reste ouverte.", false, true);
        }
      } catch (error) {
        if (showConfirmation) setStatus("Impossible de sauvegarder le brouillon sur cet appareil.", true);
      }
    }

    function restoreDraft() {
      const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY);
      if (!raw) return;
      try {
        const draft = JSON.parse(raw);
        $("#visitDate").value = draft.visitDate || $("#visitDate").value;
        $("#visitTime").value = draft.visitTime || $("#visitTime").value;
        $("#engineer").value = draft.engineer || "";
        $("#siteAddress").value = draft.siteAddress || "";
        $("#postalCode").value = draft.postalCode || "";
        $("#city").value = draft.city || "";
        $("#clientBlock").value = draft.clientBlock || [draft.recipientCivility, draft.recipientName].filter(Boolean).join(" ");
        $("#mission").value = draft.mission || draft.reportTitle || "";
        const presentPeopleEntries = Array.isArray(draft.presentPeopleEntries)
          ? draft.presentPeopleEntries
          : String(draft.presentPeople || "").split(/\r?\n/);
        [1, 2, 3, 4].forEach((index) => {
          $(`#presentPerson${index}`).value = presentPeopleEntries[index - 1] || "";
        });
        $("#workDescription").value = draft.workDescription || "";
        const constructionItems = Array.isArray(draft.constructionItems)
          ? draft.constructionItems
          : String(draft.construction || "").split(/\r?\n/).map((item) => item.replace(/^[-•]\s*/, ""));
        [1, 2, 3, 4, 5, 6].forEach((index) => {
          $(`#construction${index}`).value = constructionItems[index - 1] || "";
        });
        state.sitePhoto = draft.sitePhoto && draft.sitePhoto.dataUrl ? draft.sitePhoto : null;
        renderSitePhoto();
        $("#visitNote").value = draft.visitNote || "";
        $("#conclusion").value = draft.conclusion || "";
        $("#recommendation").value = draft.recommendation || "";
        const diffusionEntries = Array.isArray(draft.diffusionEntries)
          ? draft.diffusionEntries
          : String(draft.diffusion || "").split(/\r?\n/);
        [1, 2, 3].forEach((index) => {
          $(`#diffusion${index}`).value = diffusionEntries[index - 1] || "";
        });
        if (Array.isArray(draft.levels) && draft.levels.length) {
          state.levels = draft.levels.map((level) => ({
            id: level.id || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random())),
            name: level.name,
            isDefault: window.LISEC_DATA.niveaux.includes(level.name),
            entries: (level.entries || []).map((entry) => ({
              id: entry.id || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random())),
              localisation: entry.localisation || "",
              comment: entry.comment || "",
              gravity: entry.gravity || "",
              photos: (entry.photos || []).filter((photo) => photo && photo.dataUrl)
            }))
          }));
          renderLevels();
        }
      } catch (error) {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    function setStatus(message, isError = false, isOk = false) {
      const status = $("#status");
      status.textContent = message;
      status.className = `status${isError ? " error" : ""}${isOk ? " ok" : ""}`;
    }

    function currentTimeValue() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
    }

    function ensureFreshVersion() {
      const versionKey = "lisec_app_version";
      const reloadKey = "lisec_app_reload_for_version";
      const storedVersion = localStorage.getItem(versionKey);
      const reloadedFor = sessionStorage.getItem(reloadKey);

      if (storedVersion && storedVersion !== APP_VERSION && reloadedFor !== APP_VERSION) {
        localStorage.setItem(versionKey, APP_VERSION);
        sessionStorage.setItem(reloadKey, APP_VERSION);
        window.location.replace(`${window.location.pathname}?v=${APP_VERSION}`);
        return;
      }

      localStorage.setItem(versionKey, APP_VERSION);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function registerServiceWorker() {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }
    }

    init();
  </script>
</body>
</html>
